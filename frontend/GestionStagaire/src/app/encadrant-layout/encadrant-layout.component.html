<div class="flex h-screen bg-gray-100">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl">
    <div class="p-6 text-center text-xl font-bold border-b border-slate-800">
      Panel Encadrants
    </div>

    <nav class="flex-1 p-4 space-y-2">
      <a routerLink="/encadrant/dashboard"
       routerLinkActive="bg-indigo-700 border-l-4 border-indigo-400" 
       class="block p-3 rounded hover:bg-slate-700 transition">Tableau de bord</a>
      <a routerLink="/encadrant/chat" 
      routerLinkActive="bg-indigo-700 border-l-4 border-indigo-400" 
      class="block p-3 rounded hover:bg-slate-700 transition">Messages</a>
      <a routerLink="/encadrant/tasks" 
      routerLinkActive="bg-indigo-700 border-l-4 border-indigo-400"
       class="block p-3 rounded hover:bg-slate-700 transition">Tasks</a>
    </nav>

    <div class="p-4 border-t border-slate-800">
      <button (click)="onLogout()" class="w-full text-left p-3 text-red-400 hover:bg-red-900 hover:text-white rounded transition">
        Déconnexion
      </button>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto p-8">
    <router-outlet></router-outlet>
  </main>
</div>

<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-200">
  <h2 class="text-xl font-bold text-slate-800 mb-6">Planifier un entretien</h2>

  <form [formGroup]="reunionForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700">Titre de la réunion</label>
      <input formControlName="titre" type="text" placeholder="ex: Suivi mi-parcours"
        class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700">Date et Heure</label>
      <input formControlName="dateDebut" type="datetime-local"
        class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700">Durée (minutes)</label>
      <select formControlName="duree" class="w-full p-2 border rounded-lg outline-none">
        <option [value]="15">15 min</option>
        <option [value]="30">30 min</option>
        <option [value]="60">1 heure</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700">ID du Dossier PFE</label>
      <input formControlName="pfeId" type="number"
        class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <button type="submit" [disabled]="reunionForm.invalid"
      class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition disabled:opacity-50">
      Confirmer la planification
    </button>
  </form>
</div>

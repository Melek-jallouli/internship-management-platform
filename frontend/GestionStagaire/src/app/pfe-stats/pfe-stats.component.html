<div class="card p-4 shadow-sm" *ngIf="resultatExpert">
  <h3 class="h5 mb-3">Analyse de l'Expert IA 🤖</h3>
  
  <div class="d-flex align-items-center mb-2">
    <span class="badge p-2" [style.backgroundColor]="resultatExpert.couleur">
      {{ resultatExpert.statut }}
    </span>
    <span class="ms-3 text-muted">Écart : {{ resultatExpert.ecart_pourcentage }}%</span>
  </div>

  <p class="mt-3 fst-italic border-start border-4 ps-3" [style.borderColor]="resultatExpert.couleur">
    "{{ resultatExpert.conseil }}"
  </p>

  <div class="alert alert-info py-2 mt-2">
    ⏳ Fin estimée dans : <strong>{{ resultatExpert.jours_restants_estimes }} jours</strong>
  </div>
</div>

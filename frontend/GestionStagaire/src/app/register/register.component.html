<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" 
      class="max-w-lg mx-auto p-8 bg-white shadow-2xl rounded-3xl border border-gray-100 mt-10">
  
  <div class="text-center mb-10">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
      </svg>
    </div>
    <h2 class="text-3xl font-extrabold text-gray-900">Créer un compte</h2>
    <p class="text-gray-500 mt-2 text-sm">Rejoignez la plateforme de gestion des stages</p>
  </div>

  <div class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div class="relative">
        <input formControlName="nom" placeholder="Nom" 
               class="w-full pl-4 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
      </div>
      <div class="relative">
        <input formControlName="prenom" placeholder="Prénom" 
               class="w-full pl-4 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
      </div>
    </div>

    <div class="relative">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
        </svg>
      </span>
      <input formControlName="email" type="email" placeholder="Adresse email" 
             class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
    </div>

    <div class="relative">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
        </svg>
      </span>
      <input formControlName="mot_de_passe" type="password" placeholder="Mot de passe" 
             class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
    </div>

    <div class="relative">
      <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
           <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" />
        </svg>
      </span>
      <input formControlName="telephone" type="tel" placeholder="Numéro de téléphone" 
         class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all">
    </div>
  </div>

  <div class="mt-8 mb-8">
    <label class="block text-sm font-bold text-gray-700 mb-3 px-1">Type de compte</label>
    <div class="relative">
      <select formControlName="type_utilisateur" 
              class="w-full p-3 bg-blue-50 border border-blue-100 rounded-xl text-blue-800 font-medium focus:ring-2 focus:ring-blue-500 outline-none appearance-none cursor-pointer">
        <option value="STAGIAIRE">🎓 Stagiaire</option>
        <option value="ENCADRANT_ACAD">🏛️ Encadrant Académique</option>
        <option value="ENCADRANT_PRO">💼 Encadrant Professionnel</option>
      </select>
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-blue-600">
        <svg class="h-4 w-4 fill-current" viewBox="0 0 20 20"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/></svg>
      </div>
    </div>
  </div>

  <div formGroupName="profilData" class="space-y-4 pt-4">
  
  <div *ngIf="registerForm.get('type_utilisateur')?.value === 'STAGIAIRE'" 
       class="p-4 bg-blue-50 rounded-2xl border border-dashed border-blue-200 animate-in fade-in duration-500">
    <p class="text-xs font-semibold text-blue-600 mb-3 uppercase tracking-wider">Informations Académiques</p>
    <div class="space-y-3">
      <input formControlName="etablissement_scolaire" placeholder="Nom de l'établissement" 
             class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
      <input formControlName="niveau" placeholder="Niveau d'étude (ex: Master 2)" 
             class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
    </div>
  </div>

  <div *ngIf="registerForm.get('type_utilisateur')?.value === 'ENCADRANT_ACAD'" 
       class="p-4 bg-purple-50 rounded-2xl border border-dashed border-purple-200 animate-in fade-in duration-500">
    <p class="text-xs font-semibold text-purple-600 mb-3 uppercase tracking-wider">Détails Universitaires</p>
    <div class="grid grid-cols-1 gap-3">
      <input formControlName="departement" placeholder="Département" class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-purple-500">
      <input formControlName="grade" placeholder="Grade (ex: Professeur, Docteur)" class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-purple-500">
      <input formControlName="etablissement" placeholder="Université / Établissement" class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-purple-500">
      <input formControlName="specialite" placeholder="Spécialité" class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-purple-500">
    </div>
  </div>

  <div *ngIf="registerForm.get('type_utilisateur')?.value === 'ENCADRANT_PRO'" 
       class="p-4 bg-green-50 rounded-2xl border border-dashed border-green-200 animate-in fade-in duration-500">
    <p class="text-xs font-semibold text-green-600 mb-3 uppercase tracking-wider">Détails de l'Entreprise</p>
    <div class="space-y-3">
      <input formControlName="entreprise" placeholder="Nom de l'entreprise" class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
      <input formControlName="poste" placeholder="Poste actuel" class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
      <input formControlName="annees_experience" type="number" placeholder="Années d'expérience" class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
    </div>
  </div>

</div>

  <button type="submit" [disabled]="registerForm.invalid"
          class="w-full mt-10 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 disabled:from-gray-400 disabled:to-gray-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-200 transition-all transform active:scale-95">
    Finaliser l'inscription
  </button>
</form>
